; Experiment queue (scripts/run_queue.py). Installed as /etc/supervisor/conf.d/hyperbind_queue.conf.
; autostart: the queue resumes by itself after a container restart. Exit code 0 (finished or stopped on request) is final.
; Stop:    touch /workspace/hg_reasoning_agent/runs/queue/STOP        (after the current job)
;          touch /workspace/hg_reasoning_agent/runs/queue/STOP_NOW    (at once)
; Resume:  rm the STOP file, then: supervisorctl start hyperbind_queue
; Remove:  supervisorctl stop hyperbind_queue; rm /etc/supervisor/conf.d/hyperbind_queue.conf; supervisorctl reread; supervisorctl update
[program:hyperbind_queue]
command=/workspace/hg_reasoning_agent/envs/main/bin/python -u /workspace/hg_reasoning_agent/scripts/run_queue.py --queue /workspace/hg_reasoning_agent/configs/queue_v2.json
directory=/workspace/hg_reasoning_agent
environment=PYTHONPATH="/workspace/hg_reasoning_agent/src"
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=90
stdout_logfile=/workspace/hg_reasoning_agent/runs/queue/supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2
redirect_stderr=true
